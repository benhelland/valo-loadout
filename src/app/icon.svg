<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Valoadout</title>
  <!-- Drawn for 16px first. Full-bleed accent red rather than the app's dark
       background, because a navy tile disappears into a dark browser tab bar
       and thin detail does not survive downscaling to favicon size. Solid red
       reads against light and dark chrome alike. The clipped opposite corners
       are the same notch used on cards and buttons across the UI, and are the
       one brand cue that still registers this small.
       NOTE: no double hyphens anywhere in this comment. XML forbids them
       inside comments, and naming the CSS custom properties here (they use a
       leading double hyphen) silently produced malformed SVG that browsers
       declined to render as an icon at all. -->
  <path d="M0 0 H56 L64 8 V64 H8 L0 56 Z" fill="#ff4655"/>
  <!-- Thick chevron: 13-unit arms converging to a point, filling most of the
       canvas so it stays a legible V rather than a hairline. -->
  <path d="M12 15 H25 L32 34 L39 15 H52 L37 52 H27 Z" fill="#ffffff"/>
</svg>
